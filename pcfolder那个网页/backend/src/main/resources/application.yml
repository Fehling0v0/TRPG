server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/coc_card?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root12345
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 表结构由 sql/schema.sql 手动创建，这里不让 Hibernate 自动建表
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    # REST 接口统一使用 snake_case 键名（pc_number、display_fields、created_at 等）
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# JWT 配置：生产环境请务必替换 secret（长度不少于 32 字节）
jwt:
  secret: coc-card-development-secret-key-please-change-0123456789
  # token 有效期（毫秒），默认 24 小时
  expiration-ms: 86400000
