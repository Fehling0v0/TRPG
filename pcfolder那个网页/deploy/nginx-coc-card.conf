# PC档案夹 Nginx 站点配置
# 宝塔面板用法：网站 → 添加站点（域名或填服务器 IP YOUR_SERVER_IP，根目录选
# /www/wwwroot/coc-card/dist）→ 站点设置 → 配置文件，用本文件内容替换 server{} 内部的默认内容

server {
    listen 80;
    # 有域名就替换成域名；只用 IP 访问可以写 YOUR_SERVER_IP 或删掉此行
    server_name YOUR_SERVER_IP;

    # ── 前端静态文件（Vue 打包产物）──
    root /www/wwwroot/coc-card/dist;
    index index.html;

    # Vue Router history 模式：所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端 API 反向代理（8081 端口的 Spring Boot）──
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Excel 上传限制（后端限制单文件 10MB）
        client_max_body_size 12m;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
