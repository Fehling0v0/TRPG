# 生产环境外部配置（放在 jar 同目录即可覆盖 jar 内置配置）
# 部署时只需修改下面两个 CHANGE_ME 项
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/coc_card?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: coc_user
    password: CHANGE_ME_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

jwt:
  secret: CHANGE_ME_JWT_SECRET_PLEASE_GENERATE_A_RANDOM_STRING_32BYTES_MIN
  expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.coc.card: INFO
  file:
    name: /www/wwwroot/coc-card/logs/backend.log
